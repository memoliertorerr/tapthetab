name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  core-linux:
    name: Core (Linux, Swift 6.1)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: swift:6.1
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

  strings:
    name: Localization tables
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check strings
        run: python3 -I scripts/check-strings.py

  macos:
    name: macOS app (Xcode 26)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the build number (git rev-list --count HEAD) is right.
          fetch-depth: 0
          persist-credentials: false

      - name: Select Xcode 26
        run: scripts/select-xcode.sh 26

      - name: Build (warnings are errors)
        run: swift build -Xswiftc -warnings-as-errors

      - name: Test
        run: swift test

      - name: Build universal app (ad-hoc signed)
        run: scripts/build-app.sh --universal

      # The built binary must start, report the version in the VERSION file, and know the
      # hidden rendering flags (they are what the next steps run).
      - name: Smoke test the app binary
        run: |
          set -euo pipefail
          app=dist/TapTheTab.app/Contents/MacOS/TapTheTab
          expected="$(tr -d '[:space:]' < VERSION)"

          output="$("$app" --version)"
          echo "--version: $output"
          # RescueCommands prints "TapTheTab <version> (<build>)".
          pattern='^TapTheTab ([^ ]+) \(([^)]+)\)$'
          if [[ ! "$output" =~ $pattern ]]; then
            echo "::error title=Smoke test::--version printed '$output', expected 'TapTheTab $expected (<build>)'"
            exit 1
          fi
          if [[ "${BASH_REMATCH[1]}" != "$expected" ]]; then
            echo "::error title=Smoke test::--version reports ${BASH_REMATCH[1]} but the VERSION file says $expected"
            exit 1
          fi

          # A non-zero exit fails the step by itself (set -e).
          help="$("$app" --help)"
          echo "$help"
          if ! grep -q -- '--render-screenshots' <<< "$help"; then
            echo "::error title=Smoke test::--help does not mention --render-screenshots"
            exit 1
          fi

      # The app draws its own UI from sample data (no real windows or titles) for the README.
      - name: Render screenshots
        id: screenshots
        timeout-minutes: 3
        run: dist/TapTheTab.app/Contents/MacOS/TapTheTab --render-screenshots dist/screenshots

      # The animated PNG for the README and the website, from the same sample data.
      - name: Render demo animation
        id: demo
        timeout-minutes: 3
        run: |
          set -euo pipefail
          dist/TapTheTab.app/Contents/MacOS/TapTheTab --render-demo dist/screenshots/demo.png
          size="$(wc -c < dist/screenshots/demo.png | tr -d ' ')"
          echo "demo.png: $size bytes"
          if [[ "$size" -gt 4000000 ]]; then
            echo "::error title=Demo animation::demo.png is $size bytes (more than 4 MB)"
            exit 1
          fi

      # Compares sizes and a coarse picture hash with docs/images/screenshot-reference.json.
      # Without that file it passes with a notice; the reference it would use is written to
      # dist/screenshots/screenshot-reference.json and uploaded below. A failure is reported
      # at the end of the job, after the artifacts are uploaded.
      - name: Check screenshots
        id: check-screenshots
        continue-on-error: true
        run: python3 -I scripts/check-screenshots.py --write dist/screenshots/screenshot-reference.json dist/screenshots

      - name: Upload screenshots
        # Also after a failed render, so the shots that did work can be inspected.
        if: ${{ !cancelled() && steps.screenshots.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots-${{ github.sha }}
          path: |
            dist/screenshots/*.png
            dist/screenshots/screenshot-reference.json
          if-no-files-found: error
          retention-days: 14

      - name: Package
        run: scripts/package.sh

      - name: Upload build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TapTheTab-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*.dmg
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Fail if the screenshots changed
        if: ${{ steps.check-screenshots.outcome == 'failure' }}
        run: |
          echo "::error title=Screenshot regression::The screenshots differ from docs/images/screenshot-reference.json (see the 'Check screenshots' step). If the change is intended: python3 -I scripts/check-screenshots.py --update dist/screenshots"
          exit 1
