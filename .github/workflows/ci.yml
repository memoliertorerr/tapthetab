name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  core-linux:
    name: Core (Linux, Swift 6.1)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: swift:6.1
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

  strings:
    name: Localization tables
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check strings
        run: python3 -I scripts/check-strings.py

  macos:
    name: macOS app (Xcode 26)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the build number (git rev-list --count HEAD) is right.
          fetch-depth: 0
          persist-credentials: false

      - name: Select Xcode 26
        run: scripts/select-xcode.sh 26

      - name: Build (warnings are errors)
        run: swift build -Xswiftc -warnings-as-errors

      - name: Test
        run: swift test

      - name: Build universal app (ad-hoc signed)
        run: scripts/build-app.sh --universal

      # The app draws its own UI from sample data (no real windows or titles) for the README.
      - name: Render screenshots
        id: screenshots
        timeout-minutes: 3
        run: dist/TapTheTab.app/Contents/MacOS/TapTheTab --render-screenshots dist/screenshots

      - name: Upload screenshots
        # Also after a failed render, so the shots that did work can be inspected.
        if: ${{ !cancelled() && steps.screenshots.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots-${{ github.sha }}
          path: dist/screenshots/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Package
        run: scripts/package.sh

      - name: Upload build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TapTheTab-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*.dmg
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
