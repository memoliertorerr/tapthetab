name: Bug report
description: Something in TapTheTab doesn't work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please search [existing issues](https://github.com/memoliertorerr/tapthetab/issues) first.
        **Security problems:** please report them privately instead, see [SECURITY.md](https://github.com/memoliertorerr/tapthetab/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open three Safari windows
        2. Press ⌥⇥ and type "saf"
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: TapTheTab version
      description: Menu bar icon → About, e.g. 0.1.0 (42)
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: e.g. macOS 15.1 Sequoia
    validations:
      required: true
  - type: dropdown
    id: mac
    attributes:
      label: Mac
      options:
        - Apple silicon
        - Intel
    validations:
      required: true
  - type: checkboxes
    id: permissions
    attributes:
      label: Permissions
      description: System Settings → Privacy & Security
      options:
        - label: Accessibility is granted to TapTheTab
        - label: Screen Recording is granted to TapTheTab (only needed for previews)
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - GitHub release (dmg or zip)
        - Built from source
        - Other
  - type: textarea
    id: config
    attributes:
      label: Configuration (optional)
      description: Relevant parts of ~/Library/Application Support/TapTheTab/config.json. Remove anything private.
      render: json
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots (optional)
      description: For crashes, attach the report from Console.app → Crash Reports. Remove anything private (window titles can contain personal data).
