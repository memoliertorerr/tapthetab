version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows up to date
  # (Dependabot rewrites both the SHA and the "# vX.Y.Z" comment).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]
